name: Deploy to GitHub Pages

# Shows the deployed branch in the Actions run list, which matters now that
# any branch can be the source.
run-name: Deploy ${{ github.ref_name }} by @${{ github.actor }}

# Manual only. Deploying is a publish action, so it is triggered on demand
# rather than on every push to main.
#
# No branch input is needed: the "Run workflow" UI already provides a branch
# selector, and checkout below defaults to the ref you pick there. Adding an
# input would just duplicate that -- and be misleading, since GitHub always
# reads this workflow file from the selected ref regardless.
#
# Note: workflow_dispatch only appears in the UI once this file is on the
# default branch, which it is.
on:
  workflow_dispatch:

# The repo default GITHUB_TOKEN is read-only, so the gh-pages push needs an
# explicit write grant. Scoped to this job only rather than widened repo-wide.
permissions:
  contents: write

# Two runs triggered close together would otherwise force-push ./build to
# gh-pages concurrently and could publish the older build last.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build website
        run: yarn build

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./build
          # The following lines assign commit authorship to the official
          # GH-Actions bot for deploys to `gh-pages` branch:
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          # The GH actions bot is used by default if you didn't specify the two fields.
          # You can swap them out with your own user credentials.
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          # Deploys can now come from any branch, so record which ref produced
          # the live site. Without this the gh-pages log only shows a bare sha.
          commit_message: "deploy ${{ github.ref_name }}@${{ github.sha }}"
