name: Test deployment

on:
  pull_request:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

permissions:
  contents: read

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test build website
        run: yarn build
      - name: Typecheck
        run: yarn typecheck

      # onBrokenLinks catches links to missing static files, but pathname://
      # links opt out of that check. Re-add it for just those links.
      - name: Check pathname:// targets exist
        run: |
          for target in $(grep -rho 'pathname:///[^)"]*' src/ | sed 's|pathname://||'); do
            test -f "static$target" || { echo "missing: static$target"; exit 1; }
          done
